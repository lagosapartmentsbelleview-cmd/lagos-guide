<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Reservas em React</title>
    
    <!-- Tailwind CSS para os estilos modernos -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Scripts do React e Babel (para correr JSX diretamente no browser) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- SDK do Firebase (as mesmas bibliotecas que já usa no projeto) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <!-- Ficheiro onde tem a inicialização do 'db' do Firebase -->
    <script src="js/firebase-config.js"></script> <!-- Ajuste o caminho se o seu ficheiro de config tiver outro nome -->
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Contentor onde o React vai desenhar a aplicação -->
    <div id="root"></div>

    <!-- Código React -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        function TabelaReservasReact() {
            const [reservas, setReservas] = useState([]);
            const [carregando, setCarregando] = useState(true);
            const [filtroApto, setFiltroApto] = useState("TODOS");
            const [pesquisa, setPesquisa] = useState("");

            // Carregar reservas do Firebase
            useEffect(() => {
                if (typeof db === "undefined") {
                    console.error("Firebase 'db' não encontrado. Verifique se o firebase-config.js está correto.");
                    setCarregando(false);
                    return;
                }

                db.collection("reservas").get().then(snapshot => {
                    const dados = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setReservas(dados);
                    setCarregando(false);
                }).catch(err => {
                    console.error("Erro ao carregar reservas:", err);
                    setCarregando(false);
                });
            }, []);

            // Filtragem dinâmica
            const reservasFiltradas = reservas.filter(res => {
                const atendeApto = filtroApto === "TODOS" || (res.apartamentos && res.apartamentos.includes(filtroApto));
                const atendeNome = !pesquisa || (res.nomeHospede && res.nomeHospede.toLowerCase().includes(pesquisa.toLowerCase()));
                return atendeApto && atendeNome;
            });

            return (
                <div className="p-6 max-w-7xl mx-auto font-sans">
                    <header className="flex justify-between items-center mb-6">
                        <div>
                            <h1 className="text-2xl font-bold text-gray-800">📋 Gestão de Reservas (React)</h1>
                            <p className="text-sm text-gray-500">Vista de teste ligada às 371 reservas reais do Firebase</p>
                        </div>
                        <span className="bg-blue-100 text-blue-800 text-xs font-semibold px-3 py-1 rounded-full">
                            Total: {reservasFiltradas.length} reservas
                        </span>
                    </header>

                    {/* BARRA DE FILTROS */}
                    <div className="flex flex-wrap gap-4 mb-6 bg-white p-4 rounded-lg border border-gray-200 shadow-sm">
                        <input
                            type="text"
                            placeholder="Pesquisar por hóspede..."
                            value={pesquisa}
                            onChange={(e) => setPesquisa(e.target.value)}
                            className="border rounded-md px-3 py-2 text-sm w-64 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        />

                        <select
                            value={filtroApto}
                            onChange={(e) => setFiltroApto(e.target.value)}
                            className="border rounded-md px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >
                            <option value="TODOS">Todos os Apartamentos</option>
                            <option value="Apto 1">Apto 1</option>
                            <option value="Apto 2">Apto 2</option>
                            <option value="Apto 3">Apto 3</option>
                        </select>
                    </div>

                    {/* TABELA DE RESERVAS */}
                    {carregando ? (
                        <div className="text-center py-10 text-gray-500">A carregar reservas reais do Firebase...</div>
                    ) : (
                        <div className="overflow-x-auto bg-white rounded-lg border border-gray-200 shadow-sm">
                            <table className="w-full text-left border-collapse text-sm">
                                <thead>
                                    <tr className="bg-gray-50 border-b text-gray-600 font-semibold">
                                        <th className="p-3">Hóspede</th>
                                        <th className="p-3">Apartamento(s)</th>
                                        <th className="p-3">Check-in</th>
                                        <th className="p-3">Check-out</th>
                                        <th className="p-3 text-center">Noites</th>
                                        <th className="p-3 text-right">Preço / Noite</th>
                                        <th className="p-3 text-right">Total</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-100">
                                    {reservasFiltradas.length === 0 ? (
                                        <tr>
                                            <td colSpan="7" className="text-center p-6 text-gray-400">Nenhuma reserva encontrada.</td>
                                        </tr>
                                    ) : (
                                        reservasFiltradas.map((res) => {
                                            const noites = res.noites || 1;
                                            const total = parseFloat(res.totalBruto || res.totalLiquidoFinal || 0);
                                            const precoNoite = res.precoNoite ? parseFloat(res.precoNoite) : (total / noites);

                                            return (
                                                <tr key={res.id} className="hover:bg-gray-50 transition-colors">
                                                    <td className="p-3 font-medium text-gray-800">{res.nomeHospede || "Sem Nome"}</td>
                                                    <td className="p-3">
                                                        {Array.isArray(res.apartamentos) ? (
                                                            res.apartamentos.map(a => (
                                                                <span key={a} className="bg-gray-100 text-gray-700 text-xs px-2 py-0.5 rounded mr-1">
                                                                    {a}
                                                                </span>
                                                            ))
                                                        ) : res.apartamentos || "—"}
                                                    </td>
                                                    <td className="p-3 text-gray-600">{res.checkin}</td>
                                                    <td className="p-3 text-gray-600">{res.checkout}</td>
                                                    <td className="p-3 text-center font-semibold text-gray-700">{noites}</td>
                                                    <td className="p-3 text-right text-gray-700">{precoNoite ? `${precoNoite.toFixed(2)} €` : "—"}</td>
                                                    <td className="p-3 text-right font-bold text-emerald-600">{total ? `${total.toFixed(2)} €` : "—"}</td>
                                                </tr>
                                            );
                                        })
                                    )}
                                </tbody>
                            </table>
                        </div>
                    )}
                </div>
            );
        }

        // Renderizar a aplicação React no elemento #root
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TabelaReservasReact />);
    </script>
</body>
</html>
