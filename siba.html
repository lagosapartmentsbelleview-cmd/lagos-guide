<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão SIBA / AIMA — Apartments Belleview Lagos</title>
  
  <!-- Previne o erro 404 do favicon no navegador -->
  <link rel="icon" href="data:,">

  <!-- CSS Global do Sistema -->
  <link rel="stylesheet" href="css/global.css">
  
  <!-- Estilos específicos do SIBA (complementares ao global.css) -->
  <style>
    .badge-status {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      display: inline-block;
    }
    .badge-pendente { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    .badge-enviado { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .badge-erro { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

    /* Modal de detalhes */
    .siba-modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .siba-modal-content {
      background: white;
      padding: 24px;
      width: 90%;
      max-width: 650px;
      border-radius: 8px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .guest-box {
      background: #f8f9fa;
      border-left: 4px solid #1976d2;
      padding: 10px 14px;
      margin-bottom: 10px;
      border-radius: 0 4px 4px 0;
    }
  </style>
</head>
<body>

  <!-- MENU SUPERIOR GLOBAL -->
  <header class="top-menu">
    <button class="menu-button" onclick="toggleMenu()">☰ Menu</button>
    <div id="dropdownMenu" class="dropdown-menu">
      <a href="dashboard.html">Dashboard / Início</a>
      <a href="siba.html">Gestão SIBA / AIMA</a>
      <a href="aimatest.html" target="_blank">Formulário de Alojamento (Cliente)</a>
      <a href="#" class="sair" onclick="logout()">Sair</a>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="content">
    
    <h1>Gestão de Boletins de Alojamento (SIBA / AIMA)</h1>

    <!-- CARTÕES DE RESUMO (GRID GLOBAL) -->
    <div class="totais-grid">
      <div class="total-card">
        Pendentes
        <strong id="countPendentes">0</strong>
      </div>
      <div class="total-card">
        Enviados
        <strong id="countEnviados" style="color: #2e7d32;">0</strong>
      </div>
      <div class="total-card">
        Total de Boletins
        <strong id="countTotal" style="color: #1976d2;">0</strong>
      </div>
    </div>

    <!-- FILTROS E PESQUISA -->
    <div class="filtros">
      <label for="searchGuest">Pesquisar:</label>
      <input type="text" id="searchGuest" placeholder="Nome do hóspede..." onkeyup="filtrarTabela()">
      
      <label for="filterStatus">Estado:</label>
      <select id="filterStatus" onchange="filtrarTabela()">
        <option value="TODOS">Todos</option>
        <option value="PENDENTE" selected>Pendentes</option>
        <option value="ENVIADO">Enviados</option>
      </select>

      <button onclick="carregarBoletins()">Atualizar</button>
    </div>

    <!-- TABELA ESTILIZADA DE ACORDO COM O GLOBAL.CSS -->
    <table id="tabelaTotaisAno" style="margin-bottom: 30px;">
      <thead>
        <tr>
          <th>Data Recepção</th>
          <th>Hóspede Principal</th>
          <th>N.º Hóspedes</th>
          <th>Datas da Estadia</th>
          <th>E-mail Cliente</th>
          <th>Estado</th>
          <th style="text-align: center;">Ações</th>
        </tr>
      </thead>
      <tbody id="tabelaBoletinsCorpo">
        <!-- As linhas serão inseridas dinamicamente via JS -->
      </tbody>
    </table>

  </main>

  <!-- MODAL DE DETALHES DO BOLETIM -->
  <div id="detalhesModal" class="siba-modal">
    <div class="siba-modal-content">
      <h2 style="margin-top:0; color:#1976d2;">Detalhes do Boletim</h2>
      <hr style="border:0; border-top:1px solid #eee; margin-bottom:15px;">
      
      <div id="modalDetalhesConteudo"></div>

      <div style="text-align: right; margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;">
        <button class="btn-delete" onclick="fecharModal()">Fechar</button>
      </div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="js/aimasiba.js"></script>
  <script>
    let listaBoletinsMemoria = [];

    // Toggle do menu superior
    function toggleMenu() {
      const drop = document.getElementById("dropdownMenu");
      drop.style.display = drop.style.display === "flex" ? "none" : "flex";
    }

    function fecharModal() {
      document.getElementById("detalhesModal").style.display = "none";
    }

    // Função auxiliar para obter a chave do localStorage (evita erro de duplicado)
    function getStorageKey() {
      return typeof SIBA_STORAGE_KEY !== "undefined" ? SIBA_STORAGE_KEY : "boletins_siba_pendentes";
    }

    // Carregar e renderizar dados
    function carregarBoletins() {
      if (typeof obterBoletinsSiba === "function") {
        listaBoletinsMemoria = obterBoletinsSiba();
      } else {
        const raw = localStorage.getItem(getStorageKey());
        listaBoletinsMemoria = raw ? JSON.parse(raw) : [];
      }
      
      atualizarContadores();
      filtrarTabela();
    }

    function atualizarContadores() {
      const pendentes = listaBoletinsMemoria.filter(b => b.estado === "PENDENTE").length;
      const enviados = listaBoletinsMemoria.filter(b => b.estado === "ENVIADO").length;
      
      document.getElementById("countPendentes").textContent = pendentes;
      document.getElementById("countEnviados").textContent = enviados;
      document.getElementById("countTotal").textContent = listaBoletinsMemoria.length;
    }

    function filtrarTabela() {
      const termo = document.getElementById("searchGuest").value.toLowerCase();
      const statusFiltro = document.getElementById("filterStatus").value;

      const filtrados = listaBoletinsMemoria.filter(item => {
        const hospedePrincipal = item.dados?.hospedes?.[0]?.nome || "";
        const matchNome = hospedePrincipal.toLowerCase().includes(termo);
        const matchStatus = statusFiltro === "TODOS" || item.estado === statusFiltro;
        return matchNome && matchStatus;
      });

      renderizarTabela(filtrados);
    }

    function renderizarTabela(boletins) {
      const tbody = document.getElementById("tabelaBoletinsCorpo");
      tbody.innerHTML = "";

      if (boletins.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding: 20px;">Nenhum boletim encontrado.</td></tr>`;
        return;
      }

      boletins.forEach(item => {
        const dados = item.dados || {};
        const hospedePrincipal = dados.hospedes?.[0]?.nome || "Não especificado";
        const totalHospedes = dados.hospedes?.length || (dados.numAdultos + dados.numCriancas) || 0;
        const dataFormatada = new Date(item.dataRececao).toLocaleString("pt-PT");
        
        let badgeClass = "badge-pendente";
        if (item.estado === "ENVIADO") badgeClass = "badge-enviado";
        if (item.estado === "ERRO") badgeClass = "badge-erro";

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${dataFormatada}</td>
          <td><strong>${hospedePrincipal}</strong></td>
          <td>${totalHospedes} pessoa(s)</td>
          <td>${dados.dataCheckin || "-"} a ${dados.dataCheckout || "-"}</td>
          <td>${dados.emailCliente || "—"}</td>
          <td><span class="badge-status ${badgeClass}">${item.estado}</span></td>
          <td style="text-align: center;">
            <button class="btn-edit" onclick="verDetalhes('${item.id}')">Ver / Processar</button>
            <button class="btn-delete" onclick="eliminarBoletim('${item.id}')">✕</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function verDetalhes(id) {
      const item = listaBoletinsMemoria.find(b => b.id === id);
      if (!item) return;

      const dados = item.dados || {};
      const container = document.getElementById("modalDetalhesConteudo");
      
      let htmlHospedes = "";
      (dados.hospedes || []).forEach((h, index) => {
        htmlHospedes += `
          <div class="guest-box">
            <strong>Hóspede ${index + 1}: ${h.nome}</strong><br>
            <small>
              Data Nasc: ${h.dataNascimento} | Nasc: ${h.nacionalidade} | Res: ${h.paisResidencia}<br>
              Doc: ${h.docTipo} - ${h.docNumero} (${h.docPaisEmissor})
            </small>
          </div>
        `;
      });

      container.innerHTML = `
        <p><strong>Datas da Estadia:</strong> ${dados.dataCheckin} até ${dados.dataCheckout}</p>
        <p><strong>E-mail de Contacto:</strong> ${dados.emailCliente || "Não facultado"}</p>
        <p><strong>Estado Atual:</strong> <strong>${item.estado}</strong></p>
        <h4>Lista de Hóspedes (${dados.hospedes?.length || 0}):</h4>
        ${htmlHospedes}
        
        <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #ddd;">
          <button class="btn-add" onclick="alterarEstado('${item.id}', 'ENVIADO')">Marcar como ENVIADO (SIBA)</button>
          <button class="btn-edit" onclick="alterarEstado('${item.id}', 'PENDENTE')">Marcar como PENDENTE</button>
        </div>
      `;

      document.getElementById("detalhesModal").style.display = "flex";
    }

    function guardarListaAtualizada() {
      localStorage.setItem(getStorageKey(), JSON.stringify(listaBoletinsMemoria));
    }

    function alterarEstado(id, novoEstado) {
      listaBoletinsMemoria = listaBoletinsMemoria.map(item => {
        if (item.id === id) item.estado = novoEstado;
        return item;
      });
      guardarListaAtualizada();
      carregarBoletins();
      fecharModal();
    }

    function eliminarBoletim(id) {
      if (confirm("Tem a certeza que deseja eliminar este boletim do SIBA?")) {
        listaBoletinsMemoria = listaBoletinsMemoria.filter(item => item.id !== id);
        guardarListaAtualizada();
        carregarBoletins();
      }
    }

    function logout() {
      window.location.href = "login.html";
    }

    // Inicialização
    document.addEventListener("DOMContentLoaded", carregarBoletins);
  </script>
</body>
</html>
