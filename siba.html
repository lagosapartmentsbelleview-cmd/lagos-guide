<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Gestão SIBA / AIMA — Apartments Belleview</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f7fa; color: #1e293b; margin: 0; padding: 20px; }
    
    .container { max-width: 1100px; margin: 0 auto; }
    
    /* Cabeçalho do Painel */
    .header { background-color: #0a2540; color: #ffffff; padding: 20px 25px; border-radius: 10px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { margin: 0; font-size: 20px; }
    .badge-env { background-color: #f59e0b; color: #000; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 12px; text-transform: uppercase; }
    .badge-env.producao { background-color: #10b981; color: #fff; }

    /* Ações Globais */
    .actions-bar { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .btn-refresh { background-color: #0070ba; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-refresh:hover { background-color: #005a96; }

    /* Tabela de Boletins */
    .card-table { background: #ffffff; border-radius: 10px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    th { background-color: #f8fafc; color: #64748b; padding: 14px; border-bottom: 1px solid #e2e8f0; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
    td { padding: 14px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    tr:hover { background-color: #f8fafc; }

    /* Badges de Estado */
    .status { padding: 4px 10px; border-radius: 12px; font-weight: bold; font-size: 11px; display: inline-block; }
    .status-PENDENTE { background-color: #fef3c7; color: #b45309; }
    .status-SUBMETIDO_WS { background-color: #d1fae5; color: #047857; }
    .status-DESCARREGADO_XML { background-color: #dbeafe; color: #1d4ed8; }
    .status-ERRO_WS { background-color: #fee2e2; color: #b91c1c; }

    /* Controlos da Tabela */
    select { padding: 6px 10px; border-radius: 6px; border: 1px solid #cbd5e1; background: #fff; font-size: 13px; }
    .btn-action { border: none; padding: 7px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: 600; margin-right: 4px; }
    .btn-ws { background-color: #059669; color: white; }
    .btn-ws:hover { background-color: #047857; }
    .btn-xml { background-color: #2563eb; color: white; }
    .btn-xml:hover { background-color: #1d4ed8; }
    .btn-delete { background-color: #ef4444; color: white; }
    .btn-delete:hover { background-color: #dc2626; }

    .empty-state { padding: 40px; text-align: center; color: #94a3b8; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Cabeçalho -->
    <div class="header">
      <div>
        <h1>Gestão de Boletins SIBA / AIMA</h1>
        <small style="color: #94a3b8;">Apartments Belleview Lagos</small>
      </div>
      <div id="env-badge" class="badge-env">MODO TESTE</div>
    </div>

    <!-- Barra de Ferramentas -->
    <div class="actions-bar">
      <button class="btn-refresh" onclick="carregarTabela()">🔄 Atualizar Lista</button>
      <span id="total-count" style="font-size: 14px; font-weight: 600; color: #64748b;">Total: 0 boletins</span>
    </div>

    <!-- Tabela CRUD -->
    <div class="card-table">
      <table>
        <thead>
          <tr>
            <th>Data Receção</th>
            <th>Hóspede Principal</th>
            <th>Datas Estadia</th>
            <th>Estado</th>
            <th>Atribuir Apartamento</th>
            <th>Ações SIBA / AIMA</th>
          </tr>
        </thead>
        <tbody id="tabela-boletins">
          <!-- Conteúdo gerado dinamicamente via JS -->
        </tbody>
      </table>
      <div id="empty-msg" class="empty-state" style="display: none;">
        Nenhum boletim guardado até ao momento.
      </div>
    </div>
  </div>

  <!-- Carrega a lógica do SIBA e depois executa o Painel -->
  <script src="js/aimasiba.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      atualizarBadgeAmbiente();
      carregarTabela();
    });

    // Atualiza o indicador visual de Teste/Produção
    function atualizarBadgeAmbiente() {
      const badge = document.getElementById("env-badge");
      if (typeof SIBA_CONFIG !== "undefined") {
        if (SIBA_CONFIG.modoTeste) {
          badge.textContent = "MODO TESTE (Homologação)";
          badge.className = "badge-env";
        } else {
          badge.textContent = "MODO PRODUÇÃO (Oficial)";
          badge.className = "badge-env producao";
        }
      }
    }

    // Carrega os dados da localStorage para a tabela
    function carregarTabela() {
      const lista = typeof obterBoletinsSiba === "function" ? obterBoletinsSiba() : [];
      const tbody = document.getElementById("tabela-boletins");
      const emptyMsg = document.getElementById("empty-msg");
      const totalCount = document.getElementById("total-count");

      tbody.innerHTML = "";
      totalCount.textContent = `Total: ${lista.length} boletins`;

      if (lista.length === 0) {
        emptyMsg.style.display = "block";
        return;
      }

      emptyMsg.style.display = "none";

      // Percorre a lista do mais recente para o mais antigo
      lista.reverse().forEach((b) => {
        const tr = document.createElement("tr");

        const dataRececao = new Date(b.dataRececao).toLocaleString("pt-PT");
        const hospedePrincipal = b.dados?.hospedes?.[0]?.nome || "Sem Nome";
        const totalHospedes = b.dados?.hospedes?.length || 1;
        const checkinOut = `${b.dados?.dataCheckin} ➔ ${b.dados?.dataCheckout}`;
        const aptAtual = b.apartamento || "";

        tr.innerHTML = `
          <td><small>${dataRececao}</small></td>
          <td><strong>${hospedePrincipal}</strong><br><small style="color:#64748b;">(${totalHospedes} hóspede(s))</small></td>
          <td><small>${checkinOut}</small></td>
          <td><span class="status status-${b.estado}">${b.estado}</span></td>
          <td>
            <select id="select-apt-${b.id}">
              <option value="">-- Escolha (0, 1, 2) --</option>
              <option value="0" ${aptAtual === "0" ? "selected" : ""}>Apt 0 (26313/AL)</option>
              <option value="1" ${aptAtual === "1" ? "selected" : ""}>Apt 1 (116670/AL)</option>
              <option value="2" ${aptAtual === "2" ? "selected" : ""}>Apt 2 (116671/AL)</option>
            </select>
          </td>
          <td>
            <button class="btn-action btn-ws" onclick="acaoEnviarWS('${b.id}')" title="Enviar para Web Service SIBA">🌐 Web Service</button>
            <button class="btn-action btn-xml" onclick="acaoDescarregarXML('${b.id}')" title="Descarregar Ficheiro XML">💾 XML</button>
            <button class="btn-action btn-delete" onclick="acaoApagar('${b.id}')" title="Eliminar Registo">🗑️</button>
          </td>
        `;

        tbody.appendChild(tr);
      });
    }

    // Ação: Submeter via Web Service
    function acaoEnviarWS(id) {
      const aptNum = document.getElementById(`select-apt-${id}`).value;
      if (!aptNum) {
        alert("Por favor selecione o apartamento (0, 1 ou 2) primeiro.");
        return;
      }
      enviarParaSibaWebService(id, aptNum).then(() => carregarTabela());
    }

    // Ação: Descarregar XML
    function acaoDescarregarXML(id) {
      const aptNum = document.getElementById(`select-apt-${id}`).value;
      if (!aptNum) {
        alert("Por favor selecione o apartamento (0, 1 ou 2) primeiro.");
        return;
      }
      descarregarXmlSibaManual(id, aptNum);
      carregarTabela();
    }

    // Ação: Eliminar Boletim
    function acaoApagar(id) {
      if (confirm("Tem certeza que deseja apagar este boletim do sistema?")) {
        let lista = obterBoletinsSiba().filter(b => b.id !== id);
        localStorage.setItem(SIBA_STORAGE_KEY, JSON.stringify(lista));
        carregarTabela();
      }
    }
  </script>
</body>
</html>
